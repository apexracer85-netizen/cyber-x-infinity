<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberX Code Studio</title><link rel="stylesheet" href="cyberx-visual-theme.css"><style>*{box-sizing:border-box}body{margin:0;background:#030b14;color:#e6f7ff;font:14px system-ui}.wrap{max-width:1450px;margin:auto;padding:18px}.top,.panel{background:#071a29;border:1px solid #1b526f;border-radius:13px;padding:14px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn,select{background:#0d2c42;border:1px solid #247293;color:#e6f8ff;border-radius:8px;padding:9px 12px;cursor:pointer;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}textarea{width:100%;height:390px;background:#030a12;color:#cceeff;border:1px solid #17394e;padding:14px;font:13px/1.5 monospace;resize:vertical}pre{min-height:260px;white-space:pre-wrap;background:#030a12;color:#a9edc8;padding:12px;overflow:auto}iframe{width:100%;height:240px;border:0;background:white}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:8px}textarea{height:290px}}</style></head><body><div class="wrap"><header class="top"><strong>CYBERX / CODE STUDIO</strong><nav><a class="btn" href="../Command-Centre.html">COMMAND CENTRE</a> <a class="btn" href="Code-Library.html">CODE INDEX</a></nav></header><h1>Interactive Code Workbench</h1><p>JavaScript, HTML and CSS execute in an isolated preview. Other languages require their own runtimes or connected hardware.</p><div class="grid"><section class="panel"><select id="lang"><option>JavaScript</option><option>HTML</option><option>CSS</option><option>Python</option><option>SQL</option><option>C++</option><option>Arduino C++</option><option>MicroPython</option></select> <button class="btn" id="run">RUN CODE</button> <button class="btn" id="sample">SAMPLE</button> <button class="btn" id="copy">COPY</button> <button class="btn" id="save">SAVE</button><textarea id="code" spellcheck="false">console.log("Welcome to CyberX");
console.log(6 * 7);</textarea></section><section class="panel"><h3>OUTPUT CONSOLE</h3><pre id="out">Awaiting execution…</pre><h3>LIVE PREVIEW</h3><iframe id="preview" sandbox="allow-scripts"></iframe></section></div></div><script>const $=id=>document.getElementById(id),samples={JavaScript:'console.log("Hello CyberX");\nconsole.log(42);',HTML:'<!doctype html><h1>Hello CyberX</h1><p>HTML preview</p>',CSS:'body {font:20px system-ui;background:#eaf7ff;color:#123;padding:25px} h1{color:#078}',Python:'print("Hello from Python")',SQL:'SELECT 1 AS cyberx_test;'};$("sample").onclick=()=>{$("code").value=samples[$("lang").value]||"// Add code"};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("code").value);$("out").textContent="Copied"}catch(e){$("out").textContent="Clipboard unavailable"}};$("save").onclick=()=>{const blob=new Blob([$("code").value],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cyberx-code.txt";a.click();URL.revokeObjectURL(a.href)};$("run").onclick=()=>{const lang=$("lang").value,code=$("code").value,frame=$("preview");$("out").textContent="";if(lang==="JavaScript"){const b64=btoa(unescape(encodeURIComponent(code)));const src='<script>const send=(...v)=>parent.postMessage({cyberxOutput:v.map(x=>String(x))},"*");console.log=(...v)=>send(...v);try{new Function("console",atob("'+b64+'"))(console)}catch(e){send("ERROR",e.message)}<\/script>';frame.srcdoc=src;$("out").textContent="JavaScript running in sandbox. Output will appear here."}else if(lang==="HTML"){frame.srcdoc=code;$("out").textContent="HTML preview loaded."}else if(lang==="CSS"){frame.srcdoc='<style>'+code+'</style><h1>CSS Preview</h1><p>Sample content</p>';$("out").textContent="CSS preview loaded."}else{$("out").textContent=lang+" is editable and can be saved, but this browser build does not include its compiler or device runtime. No fake execution result is shown."}};window.addEventListener("message",e=>{if(e.source===$("preview").contentWindow&&e.data&&e.data.cyberxOutput)$("out").textContent=e.data.cyberxOutput.join(" ")});try{const x=JSON.parse(sessionStorage.getItem("cyberx.selected-code")||"null");if(x&&x.code){$("code").value=x.code;$("lang").value=x.language||"JavaScript";sessionStorage.removeItem("cyberx.selected-code")}}catch(e){}</script></body></html>
