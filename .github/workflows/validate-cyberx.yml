name: Validate CyberX source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required entry files
        run: |
          test -f index.html
          test -f Index/index.html
          test -f Command-Centre.html
          test -f Index/supabase-config.js
          test -f Index/supabase-rest.js
